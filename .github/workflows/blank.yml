name: Actualizar Listas IPTV

on:
  schedule:
    # Todos los días a las 03:00 UTC (10:00 PM Colombia)
  - cron: '35 15 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script IPTV
        run: python iptv_github.py

      - name: Mover archivos generados a la raíz
        run: |
          cp generated/README.md README.md || true
          cp generated/*.m3u . || true
          ls -la *.m3u README.md

      - name: Commit y push automático
        run: |
          git config user.name "IPTV Bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que subir."
          else
            git commit -m "Update $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
